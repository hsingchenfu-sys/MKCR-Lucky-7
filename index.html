<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老虎機遊戲</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="slot-machine">
        <h1 class="header-display">幸運老虎機</h1>
        
        <div id="message">按下「START」開始遊戲！</div>
        
        <div class="slots">
            <div class="reel"></div>
            <div class="reel"></div>
            <div class="reel"></div>
        </div>
        
        <button id="spinButton">START</button>
        
        <button id="resetButton">轉盤歸零</button> 
        
    </div>

    <script src="script.js"></script> 
</body>
</html>
